[tox]
envlist = py313

[pylint]
ignore = .pylintrc
disable = .pylintrc

[testenv]
passenv = aqmlator_database_url, IBMQ_TOKEN, IBMQ_CRN
whitelist_externals = git
allowlist_externals = mypy, pylint
# In case requirements.txt got updated, one wants to recreate (it was not automatic)
recreate = True
isolated_build = True
commands =
	ruff check 
	mypy aqmlator tests qbm4eo
	pylint --rcfile=.pylintrc --disable=E,C0103,C0301 .pylintrc aqmlator tests qbm4eo
	python -m unittest


[tox:.package]
basepython = python3
